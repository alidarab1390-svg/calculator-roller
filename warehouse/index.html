<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#44214b">
<title>سامانه انبار آسارول</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="locked">
<div id="login" class="hidden"></div>
<div id="app" class="hidden">
  <aside id="side">
    <div class="brand"><img src="icon-192.png" alt=""><div><b>انبار آسارول</b><small>رولیک‌سازی</small></div></div>
    <nav id="nav"></nav>
    <div class="who"><div id="who"></div><button class="btn ghost sm" onclick="Auth.logout()">🔒 خروج</button></div>
  </aside>
  <div id="body">
    <header id="top">
      <button class="hb menu-b" onclick="document.body.classList.toggle('menu')">☰</button>
      <h1 id="ptitle"></h1><span class="sp"></span>
      <button class="hb" id="netb" onclick="Help.show('install')"></button>
      <button class="hb" id="syncb" onclick="Auth.can('settings')?Sync.run(true):UI.toast(Sync.status())"></button>
      <button class="hb hidden" id="instb">⬇ نصب برنامه</button>
    </header>
    <main id="main"></main>
    <footer class="foot">سامانه انبار آسارول — اطلاعات روی همین دستگاه ذخیره می‌شود و در صورت فعال بودن، با ابر همگام می‌شود.</footer>
  </div>
  <div id="shade" onclick="document.body.classList.remove('menu')"></div>
</div>
<div id="modal" class="hidden" onmousedown="if(event.target===this)UI.closeModal()">
  <div class="mbox"><div class="mh"><b id="m_t"></b><button class="x" onclick="UI.closeModal()">✕</button></div><div id="m_b"></div><div class="mf" id="m_f"></div></div>
</div>
<div id="toast"></div>
<div id="print"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="js/sha256.js"></script>
<script src="js/core.js"></script>
<script src="js/auth.js"></script>
<script src="js/domain.js"></script>
<script src="js/ui.js"></script>
<script src="js/docs.js"></script>
<script src="js/master.js"></script>
<script src="js/reports.js"></script>
<script src="js/admin.js"></script>
<script src="js/sync.js"></script>
<script src="js/importer.js"></script>
<script src="js/help.js"></script>
<script src="js/app.js"></script>
</body>
</html>
